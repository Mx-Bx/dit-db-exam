apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-access-role
  namespace: data-pipeline
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-access-role-binding
  namespace: data-pipeline
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-access-role
subjects:
- kind: ServiceAccount
  name: default
  namespace: data-pipeline

