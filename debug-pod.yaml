apiVersion: v1
kind: Pod
metadata:
  name: pvc-debug-pod
  namespace: default
spec:
  containers:
  - name: debug-container
    image: busybox
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts:
    - name: debug-storage
      mountPath: /mnt/spark-storage
  volumes:
  - name: debug-storage
    persistentVolumeClaim:
      claimName: single-access-pvc

