# k8s/cassandra.yaml

# 1. PersistentVolumeClaim for Cassandra Data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cassandra-pvc
  namespace: data-pipeline
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

# 2. Cassandra Deployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cassandra
  namespace: data-pipeline
  labels:
    app: cassandra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      namespace: data-pipeline
      labels:
        app: cassandra
    spec:
      containers:
        - name: cassandra
          image: cassandra:latest
          ports:
            - containerPort: 9042
          env:
            - name: MAX_HEAP_SIZE
              value: "512M"
            - name: HEAP_NEWSIZE
              value: "100M"
            - name: CASSANDRA_USERNAME
              value: "cassandra"
            - name: CASSANDRA_PASSWORD
              value: "cassandra"
          volumeMounts:
            - name: cassandra-storage
              mountPath: /var/lib/cassandra
      volumes:
        - name: cassandra-storage
          persistentVolumeClaim:
            claimName: cassandra-pvc

# 3. Cassandra Service
---
apiVersion: v1
kind: Service
metadata:
  name: cassandra
  namespace: data-pipeline
spec:
  ports:
    - port: 9042
      targetPort: 9042
  selector:
    app: cassandra

