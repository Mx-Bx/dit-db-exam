# k8s/kafka-zookeeper.yaml

# 1. PersistentVolumeClaim for Zookeeper Data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zookeeper-pvc
  namespace: data-pipeline
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

# 2. Zookeeper Deployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: data-pipeline
  labels:
    app: zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      namespace: data-pipeline
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: bitnami/zookeeper:latest
          ports:
            - containerPort: 2181
          env:
            - name: ALLOW_ANONYMOUS_LOGIN
              value: "yes"
          volumeMounts:
            - name: zookeeper-storage
              mountPath: /bitnami/zookeeper
      volumes:
        - name: zookeeper-storage
          persistentVolumeClaim:
            claimName: zookeeper-pvc

# 3. Zookeeper Service
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: data-pipeline
spec:
  ports:
    - port: 2181
      targetPort: 2181
  selector:
    app: zookeeper

# 4. PersistentVolumeClaim for Kafka Data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-pvc
  namespace: data-pipeline
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

# 5. Kafka Deployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: data-pipeline
  labels:
    app: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      namespace: data-pipeline
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: bitnami/kafka:latest
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_CFG_LISTENERS
              value: PLAINTEXT://:9092
            - name: KAFKA_CFG_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_CFG_ZOOKEEPER_CONNECT
              value: zookeeper:2181
            - name: ALLOW_PLAINTEXT_LISTENER
              value: "yes"
          volumeMounts:
            - name: kafka-storage
              mountPath: /bitnami/kafka
      volumes:
        - name: kafka-storage
          persistentVolumeClaim:
            claimName: kafka-pvc

# 6. Kafka Service
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: data-pipeline
spec:
  ports:
    - port: 9092
      targetPort: 9092
  selector:
    app: kafka

# 7. Kafka UI Deployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: data-pipeline
  labels:
    app: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      namespace: data-pipeline
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: local
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: kafka:9092
            - name: DYNAMIC_CONFIG_ENABLED
              value: "true"

# 8. Kafka UI Service
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: data-pipeline
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: kafka-ui

