# k8s/redis.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: data-pipeline
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      namespace: data-pipeline
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:latest
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: data-pipeline
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
 
